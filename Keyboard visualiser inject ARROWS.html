<div class="arrow-keys">
    <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="display: flex;">
            <div class="arrow-key" id="up"><span>↑</span></div>
        </div>
        <div style="display: flex;">
            <div class="arrow-key" id="left"><span>←</span></div>
            <div class="arrow-key" id="down"><span>↓</span></div>
            <div class="arrow-key" id="right"><span>→</span></div>
        </div>
    </div>
</div>

<!-- Styles -->
<style>
    .arrow-keys {
        position: absolute;
        top: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .arrow-key {
        width: 50px;
        height: 50px;
        background-color: black; /* Solid black background */
        opacity: 0.5; /* 50% opacity for the background only */
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 5px;
        font-size: 24px;
        color: white; /* White text */
        border: 2px solid green; /* Green border */
        transition: background-color 0.2s;
        user-select: none;
        border-radius: 8px; /* Smoothing corners */
    }

    .active {
        background-color: #15ff00; /* Highlight active keys in light green */
    }
</style>

<!-- Script -->
<script>
    const arrowKeys = {
        ArrowUp: document.getElementById('up'),
        ArrowDown: document.getElementById('down'),
        ArrowLeft: document.getElementById('left'),
        ArrowRight: document.getElementById('right'),
    };

    document.addEventListener('keydown', (event) => {
        if (arrowKeys[event.key]) {
            arrowKeys[event.key].classList.add('active');
        }
    });

    document.addEventListener('keyup', (event) => {
        if (arrowKeys[event.key]) {
            arrowKeys[event.key].classList.remove('active');
        }
    });
</script>
